name: Pipeline Stage 1 - Generate Test Plan

# First stage of the human-reviewed pipeline (see pipeline-automation.yml and
# pipeline-execute.yml for the other two stages). Generates the test plan --
# or, if the reviewer requested changes, revises the existing one -- then
# stops and marks it "pending_review" in user-stories/<slug>-review.json.
# The Streamlit dashboard's Review tab reads that file: approving there
# dispatches pipeline-automation.yml; requesting changes re-dispatches this
# same workflow with the reviewer's feedback attached to the review-status
# file for this run to pick up.

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Path to the user-stories/request-*.md file to process'
        required: true
        type: string
      slug:
        description: 'Deterministic slug for output paths (specs/<slug>-test-plan.md, tests/<slug>/)'
        required: true
        type: string

permissions:
  contents: write

# Shared with pipeline-automation.yml/pipeline-execute.yml on purpose --
# concurrency groups are matched repo-wide regardless of workflow file, so
# this keeps all three stages for a given slug serialized against each other,
# not just against re-runs of this one stage.
concurrency:
  group: full-pipeline-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  generate-plan:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_USE_BEDROCK: "1"
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: eu-north-1
      REQUEST_FILE: ${{ inputs.request_file }}
      SLUG: ${{ inputs.slug }}
      REVIEW_FILE: user-stories/${{ inputs.slug }}-review.json
    steps:
      - uses: actions/checkout@v4

      - name: Sync to latest main
        run: |
          git fetch origin main --quiet
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Configure git identity for automated commits
        run: |
          git config user.name "qa-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Use a Linux-safe MCP server config for this run
        run: |
          cat > .mcp.json <<'EOF'
          {
            "mcpServers": {
              "playwright-test": {
                "command": "npx",
                "args": ["playwright", "run-test-mcp-server"]
              }
            }
          }
          EOF

      - name: Verify request file exists
        run: test -f "$REQUEST_FILE"

      - name: Set status -- planning
        run: |
          node .github/scripts/set-review-status.js "$REVIEW_FILE" --slug "$SLUG" --request-file "$REQUEST_FILE" --stage plan --status in_progress --reset-downstream
          node .github/scripts/set-request-status.js "$REQUEST_FILE" "In progress -- generating test plan"
          git add "$REVIEW_FILE" "$REQUEST_FILE"
          git commit -m "chore(pipeline): start test plan generation for $SLUG" || true
          bash .github/scripts/git-push-retry.sh

      - name: Claude Code -- generate or revise test plan
        run: |
          FEEDBACK=$(node .github/scripts/get-review-field.js "$REVIEW_FILE" plan feedback)
          if [ -n "$FEEDBACK" ]; then
            echo "Revising existing plan per reviewer feedback."
            npx claude -p "Read the existing test plan at specs/${SLUG}-test-plan.md and the testing request at \$REQUEST_FILE for context. A stakeholder reviewed the plan and requested changes: ${FEEDBACK}. Revise specs/${SLUG}-test-plan.md to address every point raised, using the playwright-test-planner subagent to re-verify against the live application where needed. Keep every existing '**Tier:**' line intact, and add one (Smoke/Sanity/Functional per CLAUDE.md's 'Test tiers' section) to any test case added or left without one. Also ensure every 'Steps:' block (including any new test cases) has its numbered steps starting at column 0 with nested '- expect: ...' bullets indented exactly 4 spaces -- not the planner's default 2-space-indented numbers, which render as a run-on paragraph instead of a nested list. If the file is missing the 16-section test plan overview (Introduction / Scope / Test Strategy / Environment Requirements / Test Schedule / Control Procedures / Functions to be Tested / Resources and Responsibilities / Deliverables / Suspension-Exit Criteria / Resumption Criteria / Dependencies / Risks / Tools / Documentation / Approvals) required by CLAUDE.md's 'Test plan document structure' section, add it at the top (with a Prepared By / Date line under the title), renumbering the existing content as sections 17 (Application Overview) and 18 (Detailed Test Scenarios) -- mark any subsection that doesn't apply to a browser-only Playwright suite (Mainframe, Beta Test, Performance/Security/Stress Test, etc.) as 'Not applicable' with a one-line reason rather than omitting it. See specs/hovers-test-plan.md and specs/single-file-upload-flow-test-plan.md for worked examples. Overwrite the file in place -- do not create a second file, and do not modify anything outside specs/${SLUG}-test-plan.md." \
              --dangerously-skip-permissions
          else
            # Always regenerate when there's no reviewer feedback pending.
            # This branch used to skip when the plan file already existed,
            # which meant re-submitting a slug with NEW requirements advanced
            # the review state machine and asked the reviewer to approve the
            # PREVIOUS plan -- the new acceptance criteria never reached it.
            echo "Generating test plan for ${SLUG} from ${REQUEST_FILE}."
            npx claude -p "Read the testing request at \$REQUEST_FILE (application URL, requirements/acceptance criteria, optional test credentials). Use the playwright-test-planner subagent to explore the live application at that URL and produce a comprehensive test plan covering happy paths, negative/boundary cases, and navigation flows, following this project's TC-<MODULE>-<NNN> convention (see CLAUDE.md). After the plan is saved, edit it three more times: (1) add a '**Tier:** Smoke' / '**Tier:** Sanity' / '**Tier:** Functional' line to every single test case per CLAUDE.md's 'Test tiers -- Submit New Request pipeline suites' section (Smoke = the 1-3 cases proving the feature works at all; Sanity = one pass over each acceptance criterion's core behavior; Functional = repeated variants, negative/boundary/edge cases); (2) fix each 'Steps:' block's markdown so numbered steps start at column 0 (no leading spaces before 'N. ') with their nested '- expect: ...' bullets indented exactly 4 spaces -- the planner's default of 2-space-indented numbers with 4-space bullets is under-indented and renders as one run-on paragraph instead of a nested list in both Streamlit and GitHub; (3) prepend the 16-section test plan overview (Introduction / Scope / Test Strategy / Environment Requirements / Test Schedule / Control Procedures / Functions to be Tested / Resources and Responsibilities / Deliverables / Suspension-Exit Criteria / Resumption Criteria / Dependencies / Risks / Tools / Documentation / Approvals, with a Prepared By / Date line under the title) required by CLAUDE.md's 'Test plan document structure -- Submit New Request pipeline suites' section, renumbering the plan's existing content as sections 17 (Application Overview) and 18 (Detailed Test Scenarios) -- fill most subsections from this project's actual pipeline/infrastructure (Playwright/TypeScript, Page Object Model, GitHub Actions, the Streamlit dashboard's Review tab) reusing the same wording across suites, mark any subsection that doesn't apply to a browser-only Playwright suite (Mainframe, Beta Test, Performance/Security/Stress Test, Bug Review Meetings, etc.) as 'Not applicable' with a one-line reason rather than omitting it, and derive sections 1, 2, 3.1/3.4, 7, and the Application Under Test / Test Data & Database lines from this suite's own acceptance criteria, not generic filler. See specs/hovers-test-plan.md and specs/single-file-upload-flow-test-plan.md for worked examples of all three fixes. Save the plan to specs/${SLUG}-test-plan.md exactly -- no other path. Do not modify any file outside specs/${SLUG}-test-plan.md." \
              --dangerously-skip-permissions
          fi

      - name: Verify plan was created
        run: |
          test -f "specs/${SLUG}-test-plan.md" || (node .github/scripts/set-review-status.js "$REVIEW_FILE" --stage plan --status failed && node .github/scripts/set-request-status.js "$REQUEST_FILE" "FAILED at planning stage -- see Actions run" && git add "$REVIEW_FILE" "$REQUEST_FILE" && git commit -m "chore(pipeline): planning failed for $SLUG" && bash .github/scripts/git-push-retry.sh && exit 1)

      - name: Commit test plan, mark pending review
        run: |
          git add "specs/${SLUG}-test-plan.md"
          node .github/scripts/set-review-status.js "$REVIEW_FILE" --stage plan --status pending_review --path "specs/${SLUG}-test-plan.md" --bump-revision --clear-feedback
          node .github/scripts/set-request-status.js "$REQUEST_FILE" "In progress -- test plan generated, awaiting stakeholder review"
          git add "$REVIEW_FILE" "$REQUEST_FILE"
          git commit -m "feat(pipeline): test plan ready for review -- $SLUG"
          bash .github/scripts/git-push-retry.sh
