name: Pipeline Stage 2 - Generate Automation Suite

# Second stage of the human-reviewed pipeline (see pipeline-plan.yml and
# pipeline-execute.yml for the other two stages). Only runs once the test
# plan has been approved in the Streamlit dashboard's Review tab -- refuses
# to run out of order otherwise. Generates the automation suite, or revises
# it per reviewer feedback, then stops and marks it "pending_review".
# Approving there dispatches pipeline-execute.yml; requesting changes
# re-dispatches this same workflow.

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Path to the user-stories/request-*.md file to process'
        required: true
        type: string
      slug:
        description: 'Deterministic slug for output paths (specs/<slug>-test-plan.md, tests/<slug>/)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: full-pipeline-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  generate-automation:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_USE_BEDROCK: "1"
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: eu-north-1
      REQUEST_FILE: ${{ inputs.request_file }}
      SLUG: ${{ inputs.slug }}
      REVIEW_FILE: user-stories/${{ inputs.slug }}-review.json
    steps:
      - uses: actions/checkout@v4

      - name: Sync to latest main
        run: |
          git fetch origin main --quiet
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Configure git identity for automated commits
        run: |
          git config user.name "qa-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Use a Linux-safe MCP server config for this run
        run: |
          cat > .mcp.json <<'EOF'
          {
            "mcpServers": {
              "playwright-test": {
                "command": "npx",
                "args": ["playwright", "run-test-mcp-server"]
              }
            }
          }
          EOF

      - name: Verify test plan is approved
        run: |
          PLAN_STATUS=$(node .github/scripts/get-review-field.js "$REVIEW_FILE" plan status)
          if [ "$PLAN_STATUS" != "approved" ]; then
            echo "Test plan status is '$PLAN_STATUS', not 'approved' -- refusing to generate automation out of order. Approve the test plan in the Review tab first."
            exit 1
          fi

      - name: Set status -- generating automation
        run: |
          node .github/scripts/set-review-status.js "$REVIEW_FILE" --stage automation --status in_progress --reset-downstream
          node .github/scripts/set-request-status.js "$REQUEST_FILE" "In progress -- generating automation suite"
          git add "$REVIEW_FILE" "$REQUEST_FILE"
          git commit -m "chore(pipeline): start automation generation for $SLUG" || true
          bash .github/scripts/git-push-retry.sh

      - name: Claude Code -- generate or revise automation suite
        id: generate
        run: |
          FEEDBACK=$(node .github/scripts/get-review-field.js "$REVIEW_FILE" automation feedback)
          if [ -f "tests/${SLUG}/suite.config.ts" ]; then
            # Aggregator suite: it selects existing tests from across the other
            # suites rather than owning spec files, so there is nothing to
            # generate and nothing for the generator to write. Generating here
            # would author duplicate spec files into a suite whose entire point
            # is not to duplicate anything.
            echo "tests/${SLUG}/ is an aggregator suite (suite.config.ts present) -- skipping generation."
            echo "fresh_generation=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$FEEDBACK" ]; then
            echo "Revising existing automation suite per reviewer feedback."
            echo "fresh_generation=false" >> "$GITHUB_OUTPUT"
            npx claude -p "Read the existing automation suite under tests/${SLUG}/ and the test plan at specs/${SLUG}-test-plan.md for context. A stakeholder reviewed the suite and requested changes: ${FEEDBACK}. Revise the suite under tests/${SLUG}/ to address every point raised, using the playwright-test-generator subagent as needed. Keep the existing Page Object Model structure, TC-ID-named tests, and { tag: ['@smoke' | '@sanity' | '@functional', '@regression'] } tags where still applicable, adding tags to any test that's missing them per its plan Tier (always the tier tag plus '@regression'). Do not modify anything outside tests/${SLUG}/." \
              --dangerously-skip-permissions
          else
            echo "fresh_generation=true" >> "$GITHUB_OUTPUT"
            # Always regenerate when no reviewer feedback is pending. This
            # branch used to be guarded by "spec files already exist -> skip",
            # which meant re-submitting a slug with NEW requirements left the
            # OLD suite in place and asked the reviewer to approve it.
            #
            # Clear the directory first: the generator writes only the files
            # the new plan calls for, so spec files belonging to a previous
            # plan would otherwise survive and keep running alongside them.
            # Guarded because this is an rm -rf on an interpolated input.
            case "$SLUG" in
              ""|*[!a-z0-9-]*)
                echo "Refusing to clear tests/${SLUG} -- unexpected slug format."
                exit 1
                ;;
              *)
                rm -rf "tests/${SLUG}"
                ;;
            esac
            npx claude -p "Read the test plan at specs/${SLUG}-test-plan.md. Use the playwright-test-generator subagent to create a Playwright TypeScript automation suite implementing every test case in that plan, one test() per test case named with its Test Case ID. Build a Page Object Model framework following CLAUDE.md's 'Page Object contract -- Submit New Request pipeline suites' section exactly: one class per page/feature area under tests/${SLUG}/page-objects/, each extending the shared BasePage already committed at tests/_shared/base-page.ts, with locators exposed as get accessor methods (not readonly constructor properties) and this project's getByRole/getByLabel/getByTestId/getByText-before-CSS locator priority. See tests/hovers/page-objects/hovers.page.ts for a worked example, including its two documented CSS exceptions (structural scoping of repeated identical elements, and attached-but-hidden assertions that getByRole locators can't represent). Every test case in the plan has a '**Tier:** Smoke/Sanity/Functional' line -- carry it onto the matching test() using the object-option form (not a string suffix on the title), paired with '@regression' so the test joins the cross-suite regression set: { tag: ['@smoke', '@regression'] } / { tag: ['@sanity', '@regression'] } / { tag: ['@functional', '@regression'] }, per CLAUDE.md's 'Test tiers' and 'Regression tag' sections; see tests/hovers/*.spec.ts for a worked example. Every test gets exactly one tier tag plus '@regression'. Inside each test body, precede the code for each of that test case's numbered plan steps with a '// N. <step text>' comment (matching the plan's step numbering), and put each validation on a '// expect: <validation>' comment line above its assertion -- the dashboard's Test Case Detail tab parses these markers to show per-step expected/actual coverage with the automation code for each step, and without them it can only fall back to the plan's step text with no code attached. Immediately after each numbered step's assertions, call 'await stepShot(page, N)' with that step's number, importing it as \"import { stepShot } from '../_shared/step-shot';\" (adjust the relative depth if the spec sits in a subfolder) -- it captures that step's page state as visual evidence, which the dashboard shows under the step's expected/actual. Do not modify tests/_shared/step-shot.ts, only import it. Write all files under tests/${SLUG}/ only -- do not write outside that directory (other than reading, never modifying, tests/_shared/base-page.ts), and do not modify your own agent definition or any .claude/ file." \
              --dangerously-skip-permissions
          fi

      - name: Verify automation suite was created
        run: |
          # An aggregator suite legitimately has no spec files of its own --
          # its suite.config.ts IS the suite.
          if [ ! -f "tests/${SLUG}/suite.config.ts" ] && [ -z "$(find tests/${SLUG} -name '*.spec.ts' 2>/dev/null)" ]; then
            node .github/scripts/set-review-status.js "$REVIEW_FILE" --stage automation --status failed
            node .github/scripts/set-request-status.js "$REQUEST_FILE" "FAILED at generation stage -- see Actions run"
            git add "$REVIEW_FILE" "$REQUEST_FILE"
            git commit -m "chore(pipeline): generation failed for $SLUG"
            bash .github/scripts/git-push-retry.sh
            exit 1
          fi

      # Only gated on brand-new suites: CLAUDE.md's tier convention explicitly
      # doesn't apply retroactively to suites generated before it existed, so
      # revising one of those (or an idempotent skip) must not newly start
      # failing here for tags that were never expected to be there.
      - name: Verify every test has a Smoke/Sanity/Functional tier tag
        if: steps.generate.outputs.fresh_generation == 'true'
        run: |
          if ! node .github/scripts/check-test-tiers.js "tests/${SLUG}"; then
            node .github/scripts/set-review-status.js "$REVIEW_FILE" --stage automation --status failed
            node .github/scripts/set-request-status.js "$REQUEST_FILE" "FAILED at generation stage -- see Actions run (missing Smoke/Sanity/Functional tier tags)"
            git add "$REVIEW_FILE" "$REQUEST_FILE"
            git commit -m "chore(pipeline): generation failed for $SLUG (missing tier tags)"
            bash .github/scripts/git-push-retry.sh
            exit 1
          fi

      - name: Commit automation suite, mark pending review
        run: |
          # -A so spec files the previous plan produced, but the new one no
          # longer calls for, are staged as deletions rather than left behind.
          git add -A "tests/${SLUG}"
          node .github/scripts/set-review-status.js "$REVIEW_FILE" --stage automation --status pending_review --path "tests/${SLUG}/" --bump-revision --clear-feedback
          node .github/scripts/set-request-status.js "$REQUEST_FILE" "In progress -- automation suite generated, awaiting stakeholder review"
          git add "$REVIEW_FILE" "$REQUEST_FILE"
          git commit -m "feat(pipeline): automation suite ready for review -- $SLUG"
          bash .github/scripts/git-push-retry.sh
